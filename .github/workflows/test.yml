name: NewsIntel AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Test Suite & Trace Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run offline test suite
        run: |
          cd backend
          python -m pytest -q -p no:cacheprovider --ignore=tests/test_mcp_real_session.py

      - name: Verify live agent trace artifact
        run: |
          cd backend
          python scripts/verify_live_trace.py
